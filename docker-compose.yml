services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      APP_ENV: production
      DEBUG: "false"
    restart: unless-stopped

  web:
    build:
      context: ./frontend/zamp
      additional_contexts:
        # The labelled test invoices, served for testers to download.
        iitm: ./backend/tests/fixtures/iitm
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

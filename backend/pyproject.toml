[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "onnxruntime>=1.31.1",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.19.0",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rapidocr>=3.10.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit", "tests/api"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
